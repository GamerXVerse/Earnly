name: Earnly
include:
  - EarnlyExtensions/targets.yml
packages:
  EarnlySystems:
    path: .
configFiles:
  Debug: Config/Earnly.xcconfig
  Release: Config/Earnly.xcconfig
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Earnly:
    type: application
    platform: iOS
    sources:
      - path: Earnly
        excludes: [Core, Data, Domain, Infrastructure, Services]
    dependencies:
      - package: EarnlySystems
        product: EarnlySystems
      - target: EarnlyDeviceActivityMonitor
        embed: true
      - target: EarnlyShieldConfiguration
        embed: true
      - target: EarnlyShieldAction
        embed: true
    settings:
      configs:
        Release:
          CODE_SIGN_IDENTITY: "$(inherited)"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly-testing-secure.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Earnly-Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": EarnlyExtensions/FamilyControlsAppGroup.entitlements
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_CFBundleDisplayName: Earnly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EarnlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarnlyTests
    dependencies:
      - target: Earnly
      - package: EarnlySystems
        product: EarnlySystems
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly-testing-secure.app.tests
  EarnlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EarnlyUITests
    dependencies:
      - target: Earnly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly-testing-secure.app.uitests
schemes:
  Earnly:
    build:
      targets:
        Earnly: all
    archive:
      config: Release
    test:
      targets:
        - EarnlyTests
        - EarnlyUITests
  Earnly Demo:
    build:
      targets:
        Earnly: all
    run:
      config: Debug
      commandLineArguments:
        "-earnly-demo": true
