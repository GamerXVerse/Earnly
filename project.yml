name: Earnly
options:
  bundleIdPrefix: com.earnly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Earnly:
    type: application
    platform: iOS
    sources:
      - Earnly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Earnly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EarnlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarnlyTests
    dependencies:
      - target: Earnly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly.app.tests
  EarnlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EarnlyUITests
    dependencies:
      - target: Earnly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.earnly.app.uitests
schemes:
  Earnly:
    build:
      targets:
        Earnly: all
    test:
      targets:
        - EarnlyTests
        - EarnlyUITests
